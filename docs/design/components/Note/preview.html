<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>Note</title>
<style> body { padding: 16px; } </style></head>
<body>
  <div style="display:flex;flex-direction:column;gap:8px;max-width:560px">
    <div class="note info">적용은 고른 것만 해요.</div>
    <div class="note warn" role="status">이 브라우저에 저장하지 않은 1화 본문 초안이 남아 있어요 (12초 전).</div>
    <div class="note ok">3화를 검토 화면에서 반영했어요. 이어 가기를 누르세요.</div>
    <div class="note err">복사하지 못했어요. 줄을 직접 골라 복사하세요</div>
    <div class="note plain">8화까지 남은 화가 없어요.</div>
  </div>
</body>
</html>
