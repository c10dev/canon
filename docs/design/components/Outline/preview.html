<!-- @dsCard group="틀" height=320 width=1000 subtitle="app.css 의 문체 화면(.sty-*) 규칙을 옮긴 정적 미리보기" -->
<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>Outline</title>
<style> body { padding: 16px; } </style></head>
<body>
  <div class="sty-wrap">
    <div class="sty-doc">
      <nav class="sty-toc" aria-label="문체 목차">
        <div class="sty-toc-list">
          <div class="sty-toc-h">프로필</div>
          <button type="button" class="sty-toc-item" aria-current="true"><span class="tl">문장과 리듬</span><span class="st">채움</span></button>
          <button type="button" class="sty-toc-item warn"><span class="tl">문체 표지</span><span class="st">확인 2</span></button>
          <button type="button" class="sty-toc-item"><span class="tl">예시 문단</span><span class="st">3개</span></button>
        </div>
      </nav>
      <div class="sty-secs">
        <section class="card"><div class="between"><h2 style="margin:0;font-size:1.0625rem">문장과 리듬</h2><button type="button" class="btn small" aria-expanded="false">고치기</button></div><p class="desc" style="margin:0">짧은 문장 위주, 대사 뒤에 한 줄 행동을 둔다.</p></section>
        <section class="card"><div class="between"><h2 style="margin:0;font-size:1.0625rem">문체 표지</h2><button type="button" class="btn small" aria-expanded="false">고치기</button></div><p class="desc" style="margin:0">'-었다' 어미 · 말줄임 · 쉼표 적게.</p></section>
      </div>
    </div>
  </div>
</body>
</html>
