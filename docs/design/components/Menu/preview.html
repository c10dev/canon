<!-- @dsCard group="동작" height=360 subtitle="app.css 를 옮긴 정적 미리보기 (창은 제자리에 그림)" -->
<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>Menu</title>
<style> body { padding: 16px; } .pop-panel { position: static; margin-top: 6px; } </style></head>
<body>
  <div class="menu" style="flex-direction:column;align-items:flex-start">
    <button type="button" class="btn" aria-expanded="true" aria-controls="pop-demo" aria-label="더 보기 메뉴">⋯</button>
    <div class="pop-panel" id="pop-demo">
      <div class="pop-legend" style="padding:4px 10px">생성 방식</div>
      <label class="pop-radio"><input type="radio" name="m" checked><span><b>한 번에 쓰기</b><span class="small">본문을 한 요청으로 써요</span></span></label>
      <label class="pop-radio"><input type="radio" name="m"><span><b>큐 시트로 쓰기</b><span class="small">큐마다 나눠 써요</span></span></label>
      <div class="pop-sep" role="separator"></div>
      <button type="button" class="pop-item">작업지시서 .md 내려받기</button>
      <button type="button" class="pop-item">컨텍스트 보기 <span class="small">12,400자</span></button>
      <details class="pop-danger"><summary class="pop-item">화 지우기</summary></details>
    </div>
  </div>
</body>
</html>
