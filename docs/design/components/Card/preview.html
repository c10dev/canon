<!-- @dsCard group="틀" height=520 subtitle="app.css 를 옮긴 정적 미리보기" -->
<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>Card</title>
<style> body { padding: 16px; } </style></head>
<body>
  <div class="card" style="max-width:520px">
    <div class="between"><h2 style="margin:0;font-size:1.0625rem;letter-spacing:-0.02em">이번 화 플롯</h2><button type="button" class="btn small">고치기</button></div>
    <p class="desc" style="margin:0">서윤이 검가의 옛 서고에 숨어든다. 도현은 그를 알아보지만 모른 척한다.</p>
    <div class="row"><span class="chip confirmed">확정</span><span class="small">기 구간 · 1 / 8화</span></div>
  </div>
  <div class="card tight" style="max-width:520px;margin-top:12px"><span class="small">작은 카드(.card.tight)</span><span>인물 2명 · 관계 1개</span></div>
  <section class="sec" style="max-width:520px;margin-top:16px"><div class="between"><h2 style="margin:0;font-size:1.0625rem;letter-spacing:-0.02em">주요 인물</h2><span class="small">구역(.sec): 목록은 상자 없이</span></div>
    <ul style="list-style:none;margin:0;padding:0"><li style="padding:10px 0">서윤 <span class="small">주인공</span></li><li style="padding:10px 0;border-top:1px solid var(--rule)">도현 <span class="small">조연</span></li></ul>
  </section>
  <section class="card tight w-gist" style="max-width:520px;margin-top:12px"><div class="w-gist-head"><h2>3화 상태 변경안</h2><span class="small">9/11건 고름</span></div>
    <ul class="w-gist-list">
      <li><a class="w-gist-row" href="#"><span class="w-gist-k">요약</span><span class="w-gist-n">1</span><span class="w-gist-p">서윤과 도현이 등대에서 만난다.</span></a></li>
      <li><a class="w-gist-row" href="#"><span class="w-gist-k">관계 사건</span><span class="w-gist-n">2/3</span><span class="w-gist-p">도현 → 서윤 도움 · 서윤 → 도현 칭찬</span></a></li>
      <li><a class="w-gist-row" href="#"><span class="w-gist-k">설정 바꾸기</span><span class="w-gist-n">0/1</span><span class="w-gist-p">서윤 외모</span></a></li>
    </ul>
    <div class="w-gist-act"><button type="button" class="btn">추천대로 반영</button><span class="small">설정 바꾸기 1개는 반영하지 않아요</span><a class="btn ghost" href="#">상태 승인으로</a></div>
  </section>
</body>
</html>
