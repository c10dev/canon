name: 버그 알리기
description: 화면이나 명령줄에서 생각과 다르게 동작하는 것
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나요
      description: 어떤 화면에서 무엇을 눌렀고, 무엇을 기대했고, 실제로 어떻게 됐는지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 다시 해 보는 순서
      placeholder: |
        1. 작품 홈에서 …
        2. …
  - type: dropdown
    id: backend
    attributes:
      label: 생성 방식
      options: [Gemini, Claude 구독 로그인, Claude API 키, 로컬 서버, mock, 모름]
  - type: dropdown
    id: form
    attributes:
      label: 작품 형식
      options: [단편, 장편 연재, 상관없음]
  - type: textarea
    id: log
    attributes:
      label: 오류 문구 · 서버 출력
      description: 화면 알림이나 `python -m canon serve` 출력을 붙여 주세요. API 키와 작품 본문은 지워 주세요.
      render: text
