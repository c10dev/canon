<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Canon 레퍼런스 가져오기</title>
<style>
  body { width: 320px; margin: 0; padding: 12px; font: 13px/1.5 system-ui, sans-serif; color: #1f2328; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  label { display: block; margin-top: 8px; font-weight: 600; }
  label span { font-weight: 400; color: #656d76; }
  input { box-sizing: border-box; width: 100%; padding: 5px 7px; margin-top: 2px; border: 1px solid #d0d7de; border-radius: 6px; font: inherit; }
  .row { display: flex; gap: 6px; margin-top: 12px; }
  button { flex: 1; padding: 7px; border: 1px solid #d0d7de; border-radius: 6px; background: #f6f8fa; font: inherit; cursor: pointer; }
  button.primary { background: #1f2328; color: #fff; border-color: #1f2328; }
  button:disabled { opacity: .5; cursor: default; }
  #status { margin-top: 10px; padding: 8px; border-radius: 6px; background: #f6f8fa; white-space: pre-wrap; }
  #status.err { background: #fff1e5; color: #953800; }
  #status:empty { display: none; }
</style>
</head>
<body>
<h1>Canon 레퍼런스 가져오기</h1>
<label for="canon">Canon 주소</label>
<input id="canon" type="url">
<label for="sel">본문 위치 <span>(CSS 선택자, Shadow DOM 이면 그 안의 문단)</span></label>
<input id="sel" type="text" placeholder="[data-theme-novel-content]">
<label for="next">다음 화 버튼 <span>(비우면 '다음' 글자로 찾아요)</span></label>
<input id="next" type="text" placeholder="예: a.next">
<label for="count">모을 화 수 <span>(이 화부터)</span></label>
<input id="count" type="number" min="1" max="1000" value="10">
<div class="row">
  <button id="one" type="button">이 화만 보내기</button>
  <button id="many" type="button" class="primary">자동으로 모으기</button>
</div>
<div class="row"><button id="stop" type="button" hidden>멈추기</button></div>
<div id="status" role="status"></div>
<script src="config.js"></script>
<script src="popup.js"></script>
</body>
</html>
